version: "3.9"
services:
  friendbot:
    build: .
    ports:
      - 8080:80
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:alpine3.19
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: always
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friendbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-friendbot}
    # healthcheck:
    #   test: [“CMD-SHELL”, “pg_isready”]
    #   interval: 1s
    #   timeout: 5s
    #   retries: 10
